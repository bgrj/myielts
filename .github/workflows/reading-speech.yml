name: Update natural reading speech
on:
  push:
    branches: [main]
    paths:
      - content/reading.json
      - scripts/generate-reading-audio.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reading-speech
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-content.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install edge-tts==7.3.1 mutagen==1.48.1
      - run: python scripts/generate-reading-audio.py
      - name: Publish verified reading speech
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/audio/reading-*.mp3 content/reading-audio-manifest.json web/data/reading-audio.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update natural reading speech"
          git pull --rebase origin main
          git push origin HEAD:main
